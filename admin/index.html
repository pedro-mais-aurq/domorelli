<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Domorelli / Admin</title><link rel="stylesheet" href="../assets/css/admin.css"></head>
<body><header><a href="../">DOMORELLI</a><span>/ ADMIN</span><button id="logout" hidden>Sair</button></header>
<main><p id="status" role="status" aria-live="polite"></p>
<section id="login"><h1>Painel administrativo</h1><p>Gerencie o cardápio da casa.</p><form id="login-form"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section>
<section id="panel" hidden><div class="toolbar"><h1>Cardápio</h1><button id="new">+ Novo produto</button></div><div class="filters"><label>Buscar produto<input id="search" type="search" placeholder="Nome do produto"></label><label>Categoria<select id="filter"><option value="">Todas</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Imagem</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>Nenhum produto encontrado.</p></section>
<dialog id="editor"><form id="product-form"><h2 id="editor-title">Produto</h2><p id="form-status" role="alert"></p><label>Nome<input name="name" maxlength="200" required></label><label>Descrição<textarea name="description" rows="3"></textarea></label><label>Categoria<select name="category" required></select></label><label>Preço<input name="price" inputmode="decimal" placeholder="25,90" aria-describedby="price-help"></label><small id="price-help">Deixe vazio para “Sob consulta”.</small><label>Foto (JPEG, PNG ou WebP, até 5 MB)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" alt="Foto atual do produto" hidden><label class="check"><input name="removePhoto" type="checkbox">Remover foto atual</label><label class="check"><input name="featured" type="checkbox">Destaque</label><div class="actions"><button type="submit">Salvar</button><button type="button" id="cancel">Cancelar</button><button type="button" id="delete" class="danger">Excluir</button></div></form></dialog>
</main><script src="../assets/js/vendor/supabase.js" defer></script><script src="../assets/js/config.js" defer></script><script src="../assets/js/data.js" defer></script><script src="../assets/js/admin.js" defer></script></body></html>
